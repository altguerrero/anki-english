<main class="sentence-card sentence-card--front" lang="en">
  <header class="sc-header">
    <span class="sc-eyebrow" lang="en">Sentence &amp; chunk</span>
    <span class="sc-badge">Recall</span>
  </header>
  <section class="sc-prompt" aria-label="Complete the sentence">
    <p class="sc-label">Complete the sentence</p>
    <div class="sc-sentence" lang="en">{{cloze:Text}}</div>
    {{#MeaningES}}
    <details class="sc-cue">
      <summary>Show meaning hint</summary>
      <p class="sc-cue__text" lang="es">{{MeaningES}}</p>
    </details>
    {{/MeaningES}}
  </section>
  <footer class="sc-instruction">
    <span class="sc-instruction__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 10h8M8 14h5"/></svg>
    </span>
    <div>
      <p class="sc-instruction__title">Complete it and say the full sentence aloud.</p>
      <p class="sc-instruction__text">Try to remember the missing words before showing the answer.</p>
    </div>
  </footer>
</main>
